name: Update rates
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 8 家可程序化来源(HTTP)。脚本内置时效/完整性校验,失败即 exit 1。
      - name: Fetch rates (HTTP, 8 companies)
        run: python3 fetch_rates.py

      # 宏利/中国太平:官网对机房 IP 有 WAF(403/空页),经 r.jina.ai 渲染代理取数。
      - name: Fetch rates (Manulife/China Taiping via reader proxy)
        run: python3 fetch_browser_rates.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add rates.json
            git commit -m "chore: update rates $(date -u +%F)"
            git push
          else
            echo "no changes"
          fi

      # 失败通知:开 issue(同时 GitHub 默认会给仓库所有者发失败邮件)
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo ${{ github.repository }}             --title "Rates update failed $(date -u +%F)"             --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
