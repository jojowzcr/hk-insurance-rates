name: Update rates
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rates (HTTP)
        run: python3 fetch_rates.py
      - name: Fetch rates (headless browser)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 fetch_browser_rates.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add rates.json
            git commit -m "chore: update rates $(date -u +%F)"
            git push
          else
            echo "no changes"
          fi
